<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- 背景渐变：品牌蓝（DS 主色 #2563eb 系） -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3b82f6"/>
      <stop offset="55%"  stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- 月亮光晕（冷白蓝调） -->
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="55%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="70%"  stop-color="#dbeafe" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0"/>
    </radialGradient>

    <!-- 月牙主色（暖白，呼应睡眠主题） -->
    <linearGradient id="moonFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#fff8e7"/>
      <stop offset="100%" stop-color="#ffe6b3"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App 图标背景：品牌蓝圆角方 -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- 月光晕 -->
  <circle cx="52" cy="47" r="34" fill="url(#moonGlow)"/>

  <!-- 月牙（暖白渐变） -->
  <path d="M70 58a26 26 0 1 1-32-36 21 21 0 0 0 32 36Z"
        fill="url(#moonFill)" filter="url(#softGlow)"/>

  <!-- 装饰星点（白色） -->
  <circle cx="24" cy="30" r="1.6" fill="#ffffff" opacity="0.95"/>
  <circle cx="80" cy="27" r="1.2" fill="#ffffff" opacity="0.75"/>
  <circle cx="74" cy="74" r="1.1" fill="#ffffff" opacity="0.85"/>
  <circle cx="28" cy="70" r="0.9" fill="#ffffff" opacity="0.65"/>
  <circle cx="58" cy="20" r="0.8" fill="#ffffff" opacity="0.55"/>
</svg>
