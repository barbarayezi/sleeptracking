<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- 背景渐变：品牌蓝（DS 主色 #2563eb 系） -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#3b82f6"/>
      <stop offset="55%"  stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- 心形白填充（微渐变增加立体感） -->
    <linearGradient id="heart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App 图标背景：品牌蓝圆角方 -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- 心形（健康意象核心） -->
  <path d="M50 78
           C 44 72, 30 60, 30 47
           a 13 13 0 0 1 20 -9.5
           a 13 13 0 0 1 20 9.5
           C 70 60, 56 72, 50 78 Z"
        fill="url(#heart)" filter="url(#softGlow)"/>

  <!-- 心率折线（白色，横穿心形） -->
  <polyline
    points="24,50 37,50 42,41 47,60 51,47 56,50 66,50"
    fill="none" stroke="#2563eb" stroke-width="4"
    stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 心形右侧点缀粒子（微量） -->
  <circle cx="24" cy="30" r="1.5" fill="#ffffff" opacity="0.55"/>
  <circle cx="76" cy="26" r="1.2" fill="#ffffff" opacity="0.45"/>
  <circle cx="79" cy="76" r="1.0" fill="#ffffff" opacity="0.35"/>
</svg>
