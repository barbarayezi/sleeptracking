<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16110E"/>
      <stop offset="45%" stop-color="#2A2018"/>
      <stop offset="100%" stop-color="#3B2D22"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFD699" stop-opacity="0.55"/>
      <stop offset="70%" stop-color="#F2A65A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#F2A65A" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- App icon background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Moon glow -->
  <circle cx="52" cy="47" r="30" fill="url(#moonGlow)"/>

  <!-- Crescent moon -->
  <path d="M70 58a26 26 0 1 1-32-36 21 21 0 0 0 32 36Z"
        fill="#FFCC80" filter="url(#softGlow)"/>

  <!-- Stars -->
  <circle cx="24" cy="30" r="1.6" fill="#FFF5D6" opacity="0.9"/>
  <circle cx="80" cy="27" r="1.2" fill="#FFF5D6" opacity="0.65"/>
  <circle cx="74" cy="74" r="1.1" fill="#FFF5D6" opacity="0.75"/>
  <circle cx="28" cy="70" r="0.9" fill="#FFF5D6" opacity="0.55"/>
  <circle cx="58" cy="20" r="0.8" fill="#FFF5D6" opacity="0.5"/>
</svg>
