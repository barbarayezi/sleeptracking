# Render.com deployment config
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: sleep-tracker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PORT
        value: "10000"
      - key: HEADLESS
        value: "1"
      - key: TURSO_URL
        sync: false      # set in Render dashboard
      - key: TURSO_AUTH_TOKEN
        sync: false      # set in Render dashboard
      - key: WHOOP_CLIENT_ID
        sync: false      # set in Render dashboard
      - key: WHOOP_CLIENT_SECRET
        sync: false      # set in Render dashboard
      - key: WHOOP_REDIRECT_URI
        value: "https://sleep-tracker.onrender.com/api/whoop/callback"
      # LLM gateway for AI meal estimation (text + vision).
      # Get values from your Claude Code gateway config or Aliyun Bailian console.
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_VISION_BASE_URL
        sync: false
      - key: LLM_VISION_API_KEY
        sync: false
      - key: LLM_VISION_MODEL
        value: "qwen-vl-max"
